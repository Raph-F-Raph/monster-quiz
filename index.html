<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Monster Quiz</title>
<style>
:root{
 --ink:#2f2a55;
 --blue:#4aa8ff;--blueD:#2b7fd1;
 --green:#4cc98a;--greenD:#2fa06a;
 --yellow:#ffd34a;--yellowD:#e0a800;
 --orange:#ff9a3c;--orangeD:#d9741a;
 --red:#ff6464;--redD:#d63f3f;
 --purple:#a98bff;--purpleD:#7b5bd6;
 --card:#ffffffee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);overflow-x:hidden}
body{
 background:
  radial-gradient(circle at 92% 6%,#ffd34a99 0 80px,transparent 81px),
  radial-gradient(circle at 4% 40%,#ff9a3c66 0 60px,transparent 61px),
  radial-gradient(circle at 96% 62%,#4cc98a66 0 90px,transparent 91px),
  radial-gradient(circle at 8% 94%,#ff646455 0 100px,transparent 101px),
  linear-gradient(180deg,#bfe6ff 0%,#e4f6ff 45%,#fff3c4 100%);
 background-attachment:fixed;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:16px 16px 28px;display:flex;flex-direction:column}
.ic{width:1em;height:1em;display:inline-block;vertical-align:middle}
h1{font-size:46px;margin:6px 0 0;text-align:center;line-height:1;letter-spacing:1px;font-weight:900}
h1 b{-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;display:inline-block;transform:rotate(var(--r,0deg))}
h2{text-align:center;margin:6px 0 14px}
.sub{text-align:center;opacity:.75;margin:6px 0 10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:20px;padding:15px 18px;font:inherit;font-size:19px;font-weight:700;color:#fff;margin:12px 0;cursor:pointer;text-shadow:0 1px 0 #0003}
.btn:active{transform:translateY(4px)}
.btn.green{background:var(--green);box-shadow:0 5px 0 var(--greenD)}
.btn.green:active{box-shadow:0 1px 0 var(--greenD)}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 var(--blueD)}
.btn.blue:active{box-shadow:0 1px 0 var(--blueD)}
.btn.orange{background:var(--orange);box-shadow:0 5px 0 var(--orangeD)}
.btn.orange:active{box-shadow:0 1px 0 var(--orangeD)}
.btn.gray{background:#b9b3cc;box-shadow:0 5px 0 #8f89a6}
.btn.gray:active{box-shadow:0 1px 0 #8f89a6}
.btn.small{font-size:15px;padding:10px 14px;width:auto;margin:0}
.btn .ic{width:20px;height:20px}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 6px 18px #2f2a5522;border-top:8px solid var(--cat,var(--blue))}
.mascot{display:flex;justify-content:center;margin:14px 0 4px;animation:bob 2.4s ease-in-out infinite}
.mascot svg{width:170px;height:170px}
@keyframes bob{50%{transform:translateY(-10px)}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hearts{display:flex;gap:4px}
.hearts .ic{width:30px;height:30px}
.bar{height:14px;background:#fff;border-radius:99px;overflow:hidden;margin:6px 0 14px;border:2px solid #fff}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--green),var(--yellow),var(--orange),var(--red));background-size:480px 100%;transition:width .4s}
.cat{display:inline-block;color:#fff;background:var(--cat,var(--blue));border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;text-shadow:0 1px 0 #0003}
.q{font-size:21px;font-weight:700;margin:12px 0;line-height:1.3}
.img{width:130px;height:130px;margin:6px auto 10px;border-radius:50%;background:radial-gradient(circle,#fff7d6 0 60%,#ffe9a8 100%);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 4px #fff}
.img .ic{width:100px;height:100px}
.ans{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:3px solid #fff;border-radius:18px;padding:11px 14px;font:inherit;font-size:18px;font-weight:600;color:var(--ink);background:#fff;margin:9px 0;cursor:pointer;box-shadow:0 3px 0 #cfc6e6}
.bd{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;text-shadow:0 1px 0 #0003}
.b0{background:var(--blue)}.b1{background:var(--yellow);color:var(--ink);text-shadow:none}.b2{background:var(--orange)}.b3{background:var(--purple)}
.ans.tf{justify-content:center;font-size:22px;font-weight:800;color:#fff;text-shadow:0 1px 0 #0003}
.ans.tf0{background:var(--blue);border-color:var(--blueD)}
.ans.tf1{background:var(--orange);border-color:var(--orangeD)}
.ans.good{background:#c9f5df;border-color:var(--green);color:var(--ink);text-shadow:none}
.ans.bad{background:#ffd5d5;border-color:var(--red);color:var(--ink);text-shadow:none}
.ans:disabled{opacity:1}
.fb{min-height:26px;text-align:center;font-weight:800;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px}
.fb.ok{color:var(--greenD)}.fb.ko{color:var(--redD)}
.fb .ic{width:22px;height:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lvl{aspect-ratio:1;border:0;border-radius:22px;font:inherit;font-size:28px;font-weight:800;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;text-shadow:0 1px 0 #0003}
.lvl:active{transform:translateY(4px)}
.lvl .st{display:flex;gap:1px}
.lvl .st .ic{width:17px;height:17px}
.lc0{background:var(--blue);box-shadow:0 5px 0 var(--blueD)}
.lc1{background:var(--green);box-shadow:0 5px 0 var(--greenD)}
.lc2{background:var(--yellow);box-shadow:0 5px 0 var(--yellowD);color:var(--ink);text-shadow:none}
.lc3{background:var(--orange);box-shadow:0 5px 0 var(--orangeD)}
.lc4{background:var(--red);box-shadow:0 5px 0 var(--redD)}
.lvl.locked{background:#d6d1e6;box-shadow:0 5px 0 #aaa4c4;cursor:default}
.lvl.locked .ic{width:38px;height:38px}
.mon{text-align:center;padding:10px;border-top-color:var(--mc,var(--blue))}
.mon svg{width:90px;height:90px}
.mon.off svg{filter:grayscale(1) brightness(.4);opacity:.55}
.mon b{display:block;font-size:14px}
.big{display:flex;justify-content:center}.big svg{width:150px;height:150px}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.stars{display:flex;justify-content:center;gap:6px}
.stars .ic{width:52px;height:52px}
.soon{opacity:.7;font-size:14px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- Couleurs ---------- */
const COL={blue:"#4aa8ff",blueD:"#2b7fd1",green:"#4cc98a",greenD:"#2fa06a",yellow:"#ffd34a",yellowD:"#e0a800",orange:"#ff9a3c",orangeD:"#d9741a",red:"#ff6464",redD:"#d63f3f",purple:"#a98bff",purpleD:"#7b5bd6",ink:"#2f2a55"};

/* ---------- Icônes dessinées (SVG, identiques sur tous les téléphones) ---------- */
const svg=(body,cls)=>`<svg viewBox="0 0 100 100" class="ic ${cls||""}" aria-hidden="true">${body}</svg>`;
const poly=(cx,cy,R,rot,n)=>{const p=[];for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n;p.push((cx+R*Math.cos(a)).toFixed(1)+","+(cy+R*Math.sin(a)).toFixed(1))}return p.join(" ")};
const starPts=(cx,cy,R,r)=>{const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r:R;p.push((cx+rad*Math.cos(a)).toFixed(1)+","+(cy+rad*Math.sin(a)).toFixed(1))}return p.join(" ")};
const ICON={
 heart:(on)=>svg(`<path d="M50 88 C12 62 8 34 27 25 C40 19 48 27 50 34 C52 27 60 19 73 25 C92 34 88 62 50 88Z" fill="${on?COL.red:"#fff"}" stroke="${on?COL.redD:"#cfc6e6"}" stroke-width="6" stroke-linejoin="round"/>${on?`<path d="M26 38 Q28 31 36 31" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>`:""}`),
 star:(on)=>svg(`<polygon points="${starPts(50,52,42,18)}" fill="${on?COL.yellow:"#ece8f6"}" stroke="${on?COL.yellowD:"#cfc6e6"}" stroke-width="6" stroke-linejoin="round"/>${on?`<path d="M38 40 L46 30" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".85"/>`:""}`),
 lock:()=>svg(`<path d="M32 46 V34 A18 18 0 0 1 68 34 V46" fill="none" stroke="#8f89a6" stroke-width="9" stroke-linecap="round"/><rect x="20" y="44" width="60" height="44" rx="10" fill="#b9b3cc" stroke="#8f89a6" stroke-width="5"/><circle cx="50" cy="62" r="6" fill="#6b6590"/><rect x="47" y="64" width="6" height="14" rx="3" fill="#6b6590"/>`),
 back:()=>svg(`<path d="M62 20 L32 50 L62 80" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>`),
 close:()=>svg(`<path d="M25 25 L75 75 M75 25 L25 75" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round"/>`),
 play:()=>svg(`<polygon points="30,18 82,50 30,82" fill="currentColor" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/>`),
 elephant:()=>svg(`
  <rect x="34" y="72" width="13" height="18" rx="5" fill="${COL.blue}" stroke="${COL.blueD}" stroke-width="3.5"/>
  <rect x="62" y="72" width="13" height="18" rx="5" fill="${COL.blue}" stroke="${COL.blueD}" stroke-width="3.5"/>
  <path d="M82 52 Q92 52 90 64" fill="none" stroke="${COL.blueD}" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="56" cy="58" rx="30" ry="23" fill="${COL.blue}" stroke="${COL.blueD}" stroke-width="3.5"/>
  <path d="M22 62 Q8 70 12 86 Q14 91 20 87" fill="none" stroke="${COL.blueD}" stroke-width="13" stroke-linecap="round"/>
  <path d="M22 62 Q8 70 12 86 Q14 91 20 87" fill="none" stroke="${COL.blue}" stroke-width="8" stroke-linecap="round"/>
  <circle cx="30" cy="48" r="19" fill="${COL.blue}" stroke="${COL.blueD}" stroke-width="3.5"/>
  <ellipse cx="46" cy="44" rx="12" ry="17" fill="#8ec9ff" stroke="${COL.blueD}" stroke-width="3.5"/>
  <path d="M22 66 Q18 74 24 78" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="26" cy="44" r="3.5" fill="${COL.ink}"/><circle cx="27.2" cy="42.8" r="1.2" fill="#fff"/>`),
 ball:()=>{
  let s=`<defs><clipPath id="bclip"><circle cx="50" cy="50" r="38"/></clipPath></defs><circle cx="50" cy="50" r="38" fill="#fff"/><g clip-path="url(#bclip)"><polygon points="${poly(50,50,13,-Math.PI/2,5)}" fill="${COL.ink}" stroke="${COL.ink}" stroke-width="2" stroke-linejoin="round"/>`;
  for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5,x1=50+13*Math.cos(a),y1=50+13*Math.sin(a),x2=50+30*Math.cos(a),y2=50+30*Math.sin(a);
   s+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${COL.ink}" stroke-width="3"/>`;
   s+=`<polygon points="${poly(50+41*Math.cos(a),50+41*Math.sin(a),13,a+Math.PI,5)}" fill="${COL.ink}"/>`;}
  return svg(s+`<ellipse cx="38" cy="30" rx="8" ry="4" fill="#fff" opacity=".7" transform="rotate(-35 38 30)"/></g><circle cx="50" cy="50" r="38" fill="none" stroke="${COL.ink}" stroke-width="5"/>`);
 },
 guitar:()=>svg(`<g transform="rotate(38 50 50) scale(.92) translate(4 4)">
  <rect x="45.5" y="10" width="9" height="44" fill="#8a5a2b" stroke="#5b3a1e" stroke-width="2.5"/>
  <rect x="42" y="2" width="16" height="14" rx="4" fill="#5b3a1e"/>
  <circle cx="46" cy="8" r="2" fill="${COL.yellow}"/><circle cx="54" cy="8" r="2" fill="${COL.yellow}"/>
  <ellipse cx="50" cy="52" rx="19" ry="15" fill="${COL.orange}" stroke="${COL.orangeD}" stroke-width="3.5"/>
  <ellipse cx="50" cy="76" rx="26" ry="21" fill="${COL.orange}" stroke="${COL.orangeD}" stroke-width="3.5"/>
  <ellipse cx="50" cy="62" rx="14" ry="10" fill="${COL.orange}"/>
  <circle cx="50" cy="68" r="8" fill="#5b3a1e"/>
  <rect x="40" y="82" width="20" height="5" rx="2" fill="#5b3a1e"/>
  <path d="M48 14 V82 M52 14 V82" stroke="#fff" stroke-width="1.6" opacity=".9"/>
  <ellipse cx="38" cy="70" rx="6" ry="3.5" fill="#fff" opacity=".45" transform="rotate(-50 38 70)"/></g>`),
 saturn:()=>svg(`<g transform="rotate(-22 50 50)">
  <path d="M6 50 A44 13 0 0 1 94 50" fill="none" stroke="${COL.yellowD}" stroke-width="7"/>
  <path d="M6 50 A44 13 0 0 1 94 50" fill="none" stroke="${COL.yellow}" stroke-width="3.5"/></g>
  <circle cx="50" cy="50" r="25" fill="${COL.orange}" stroke="${COL.orangeD}" stroke-width="4"/>
  <path d="M27 42 Q50 50 73 40 M26 56 Q50 64 74 55" fill="none" stroke="#ffd0a0" stroke-width="5" stroke-linecap="round" opacity=".85"/>
  <g transform="rotate(-22 50 50)"><path d="M6 50 A44 13 0 0 0 94 50" fill="none" stroke="${COL.yellowD}" stroke-width="7"/>
  <path d="M6 50 A44 13 0 0 0 94 50" fill="none" stroke="${COL.yellow}" stroke-width="3.5"/></g>
  <circle cx="82" cy="18" r="2.5" fill="${COL.blue}"/><circle cx="16" cy="82" r="2.5" fill="${COL.green}"/><circle cx="20" cy="20" r="2" fill="${COL.red}"/>`),
 liberty:()=>svg(`
  <rect x="30" y="82" width="40" height="12" rx="3" fill="#9aa7c7" stroke="#6f7ca0" stroke-width="3"/>
  <rect x="36" y="74" width="28" height="10" rx="2" fill="#b4bfdc" stroke="#6f7ca0" stroke-width="3"/>
  <path d="M38 76 L43 44 L57 44 L62 76Z" fill="${COL.green}" stroke="${COL.greenD}" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M47 50 L45 74 M53 50 L55 74" stroke="${COL.greenD}" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M57 48 L68 28" stroke="${COL.greenD}" stroke-width="10" stroke-linecap="round"/>
  <path d="M57 48 L68 28" stroke="${COL.green}" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M68 8 Q77 18 68 27 Q59 18 68 8Z" fill="${COL.yellow}" stroke="${COL.orange}" stroke-width="3" stroke-linejoin="round"/>
  <rect x="64" y="26" width="8" height="5" rx="1" fill="${COL.orangeD}"/>
  <rect x="31" y="52" width="12" height="16" rx="2" fill="${COL.greenD}" transform="rotate(-12 37 60)"/>
  <circle cx="50" cy="36" r="8" fill="${COL.green}" stroke="${COL.greenD}" stroke-width="3.5"/>
  <path d="M42 31 L37 25 M46 28 L44 20 M50 27 L50 19 M54 28 L56 20 M58 31 L63 25" stroke="${COL.yellowD}" stroke-width="3.5" stroke-linecap="round"/>`),
 octopus:()=>svg(`
  <g fill="none" stroke-linecap="round">
   <path d="M30 62 Q20 78 29 88 M40 66 Q35 84 44 92 M50 68 Q50 86 50 94 M60 66 Q65 84 56 92 M70 62 Q80 78 71 88" stroke="${COL.redD}" stroke-width="12"/>
   <path d="M30 62 Q20 78 29 88 M40 66 Q35 84 44 92 M50 68 Q50 86 50 94 M60 66 Q65 84 56 92 M70 62 Q80 78 71 88" stroke="${COL.red}" stroke-width="7"/></g>
  <path d="M24 56 Q18 18 50 14 Q82 18 76 56 Q50 70 24 56Z" fill="${COL.red}" stroke="${COL.redD}" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="39" cy="42" r="9" fill="#fff"/><circle cx="61" cy="42" r="9" fill="#fff"/>
  <circle cx="40" cy="44" r="4.5" fill="${COL.ink}"/><circle cx="60" cy="44" r="4.5" fill="${COL.ink}"/>
  <circle cx="41.5" cy="42" r="1.5" fill="#fff"/><circle cx="61.5" cy="42" r="1.5" fill="#fff"/>
  <path d="M43 55 Q50 62 57 55" fill="none" stroke="${COL.ink}" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="30" cy="54" r="4" fill="#ff9aa8" opacity=".8"/><circle cx="70" cy="54" r="4" fill="#ff9aa8" opacity=".8"/>
  <path d="M34 24 Q40 18 48 18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/>`)
};
const ic=(n,a)=>ICON[n](a);

/* ---------- Monstres (dessinés en SVG) ---------- */
const MONSTERS=[
 {n:"Bobo",c:COL.green,d:COL.greenD,f:"ears"},
 {n:"Pompon",c:COL.red,d:COL.redD,f:"antenna"},
 {n:"Cyclo",c:COL.yellow,d:COL.yellowD,f:"cyclops"},
 {n:"Bleuet",c:COL.blue,d:COL.blueD,f:"horns"},
 {n:"Violette",c:COL.purple,d:COL.purpleD,f:"tuft"},
 {n:"Flamme",c:COL.orange,d:COL.orangeD,f:"spikes"}
];
function monster(i,mood){
 const m=MONSTERS[i%MONSTERS.length],c=m.c,d=m.d;let top="",eyes="";
 if(m.f==="ears")top=`<circle cx="32" cy="30" r="13" fill="${c}" stroke="${d}" stroke-width="4"/><circle cx="88" cy="30" r="13" fill="${c}" stroke="${d}" stroke-width="4"/>`;
 if(m.f==="antenna")top=`<path d="M60 28 L60 10" stroke="${d}" stroke-width="4"/><circle cx="60" cy="9" r="7" fill="${COL.yellow}" stroke="${d}" stroke-width="4"/>`;
 if(m.f==="horns")top=`<path d="M34 34 L26 10 L48 26Z M86 34 L94 10 L72 26Z" fill="#fff" stroke="${d}" stroke-width="4" stroke-linejoin="round"/>`;
 if(m.f==="tuft")top=`<path d="M60 28 Q48 6 60 4 Q72 6 60 28Z" fill="${d}"/><path d="M52 28 Q36 14 44 8 Q52 10 52 28Z M68 28 Q84 14 76 8 Q68 10 68 28Z" fill="${d}"/>`;
 if(m.f==="spikes")top=`<path d="M30 34 L36 14 L46 30 L60 10 L74 30 L84 14 L90 34Z" fill="${d}"/>`;
 const mouth=mood==="sad"?`<path d="M46 86 Q60 74 74 86" fill="none" stroke="#2f2a55" stroke-width="4" stroke-linecap="round"/>`:`<path d="M44 78 Q60 96 76 78 Q60 84 44 78Z" fill="#fff" stroke="#2f2a55" stroke-width="3.5" stroke-linejoin="round"/>`;
 const eye=(x)=>`<circle cx="${x}" cy="62" r="11" fill="#fff"/><circle cx="${x+(mood==="sad"?0:2)}" cy="${mood==="sad"?65:63}" r="5.5" fill="#2f2a55"/><circle cx="${x+4}" cy="59" r="2" fill="#fff"/>`;
 if(m.f==="cyclops")eyes=`<circle cx="60" cy="58" r="17" fill="#fff"/><circle cx="62" cy="60" r="8" fill="#2f2a55"/><circle cx="66" cy="55" r="3" fill="#fff"/>`;
 else eyes=eye(44)+eye(76);
 return `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">${top}<ellipse cx="60" cy="70" rx="42" ry="40" fill="${c}" stroke="${d}" stroke-width="4"/><ellipse cx="38" cy="84" rx="7" ry="4.5" fill="#ff8fb5" opacity=".55"/><ellipse cx="82" cy="84" rx="7" ry="4.5" fill="#ff8fb5" opacity=".55"/>${eyes}${m.f==="cyclops"?mouth.replace(/ 78/g," 82").replace(/ 96/g," 100"):mouth}<ellipse cx="42" cy="108" rx="11" ry="6" fill="${d}"/><ellipse cx="78" cy="108" rx="11" ry="6" fill="${d}"/></svg>`;
}

/* ---------- Catégories colorées ---------- */
const CAT={
 "Histoire et géographie":COL.orange,
 "Sciences et nature":COL.green,
 "Sport et jeux vidéo":COL.blue,
 "Cinéma, musique, arts":COL.red
};

/* ---------- Questions (tf = vrai/faux, qcm = 4 choix, img = image + 4 choix) ---------- */
const TF=["Vrai","Faux"];
const LEVELS=[
 {name:"Petit monstre",q:[
  {t:"img",c:"Sciences et nature",q:"Quel est cet animal ?",img:"elephant",a:["Éléphant","Girafe","Hippopotame","Rhinocéros"],ok:0},
  {t:"tf",c:"Sciences et nature",q:"La Terre tourne autour du Soleil.",a:TF,ok:0},
  {t:"qcm",c:"Histoire et géographie",q:"Quelle est la capitale de la France ?",a:["Paris","Lyon","Marseille","Lille"],ok:0},
  {t:"img",c:"Sport et jeux vidéo",q:"Quel sport représente cette image ?",img:"ball",a:["Football","Tennis","Basket","Rugby"],ok:0},
  {t:"qcm",c:"Sciences et nature",q:"Combien y a-t-il de couleurs dans l'arc-en-ciel ?",a:["5","6","7","8"],ok:2}]},
 {name:"Monstre curieux",q:[
  {t:"tf",c:"Sciences et nature",q:"Le requin est un mammifère.",a:TF,ok:1},
  {t:"qcm",c:"Histoire et géographie",q:"Quel est le plus grand océan du monde ?",a:["Atlantique","Pacifique","Indien","Arctique"],ok:1},
  {t:"img",c:"Cinéma, musique, arts",q:"Quel instrument de musique est-ce ?",img:"guitar",a:["Violon","Piano","Guitare","Trompette"],ok:2},
  {t:"qcm",c:"Cinéma, musique, arts",q:"Qui a peint la Joconde ?",a:["Picasso","Léonard de Vinci","Van Gogh","Monet"],ok:1},
  {t:"tf",c:"Sport et jeux vidéo",q:"Mario est un personnage créé par Nintendo.",a:TF,ok:0}]},
 {name:"Monstre malin",q:[
  {t:"qcm",c:"Sport et jeux vidéo",q:"Combien de joueurs une équipe de football a-t-elle sur le terrain ?",a:["9","10","11","12"],ok:2},
  {t:"tf",c:"Histoire et géographie",q:"La Grande Muraille de Chine est visible à l'œil nu depuis la Lune.",a:TF,ok:1},
  {t:"img",c:"Sciences et nature",q:"Quelle planète est-ce ?",img:"saturn",a:["Jupiter","Mars","Neptune","Saturne"],ok:3},
  {t:"qcm",c:"Histoire et géographie",q:"Quel est le plus long fleuve d'Europe ?",a:["La Seine","Le Danube","La Volga","Le Rhin"],ok:2},
  {t:"qcm",c:"Histoire et géographie",q:"En quelle année l'homme a-t-il marché sur la Lune pour la première fois ?",a:["1959","1969","1979","1989"],ok:1}]},
 {name:"Grand monstre",q:[
  {t:"tf",c:"Sciences et nature",q:"L'eau bout à 100 °C au niveau de la mer.",a:TF,ok:0},
  {t:"qcm",c:"Sciences et nature",q:"Quel est le symbole chimique de l'or ?",a:["Ag","Au","Or","Fe"],ok:1},
  {t:"img",c:"Histoire et géographie",q:"Quel monument est-ce ?",img:"liberty",a:["Le Sphinx","Big Ben","Statue de la Liberté","Christ Rédempteur"],ok:2},
  {t:"qcm",c:"Cinéma, musique, arts",q:"Qui a écrit « Les Misérables » ?",a:["Molière","Victor Hugo","Émile Zola","Balzac"],ok:1},
  {t:"qcm",c:"Sciences et nature",q:"Combien d'os a un adulte humain ?",a:["106","206","306","412"],ok:1}]},
 {name:"Roi des monstres",q:[
  {t:"tf",c:"Sciences et nature",q:"Les chauves-souris sont aveugles.",a:TF,ok:1},
  {t:"qcm",c:"Histoire et géographie",q:"Quelle est la capitale de l'Australie ?",a:["Sydney","Melbourne","Canberra","Perth"],ok:2},
  {t:"img",c:"Sciences et nature",q:"Quel animal est-ce ?",img:"octopus",a:["Méduse","Pieuvre","Crabe","Étoile de mer"],ok:1},
  {t:"qcm",c:"Sciences et nature",q:"Quelle est la plus petite planète du système solaire ?",a:["Mars","Vénus","Mercure","Pluton"],ok:2},
  {t:"tf",c:"Sport et jeux vidéo",q:"Le Brésil a gagné plus de Coupes du monde de football que l'Allemagne.",a:TF,ok:0}]}
];

/* ---------- Sauvegarde locale (Supabase viendra ensuite) ---------- */
const KEY="monsterquiz_v1";
let save;
try{save=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){save=null}
save=save||{unlocked:1,stars:{},mons:[0]};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};
let G=null;const $=document.getElementById("app");

const TITLE_COLS=[COL.red,COL.orange,COL.yellow,COL.green,COL.blue,COL.purple,COL.red];
function titleHtml(){
 const w=(t,off)=>[...t].map((l,i)=>`<b style="color:${TITLE_COLS[(i+off)%TITLE_COLS.length]};--r:${(i%2?3:-3)}deg">${l}</b>`).join("");
 return `<h1>${w("Monster",0)} ${w("Quiz",3)}</h1>`;
}
const starsRow=(n,size)=>[0,1,2].map(i=>ic("star",i<n)).join("");

function home(){
 $.innerHTML=`${titleHtml()}<div class="sub">Réponds, gagne des étoiles et collectionne les monstres !</div>
 <div class="mascot">${monster(0)}</div>
 <button class="btn green" onclick="levels()">${ic("play")} Jouer</button>
 <button class="btn blue" onclick="collection()">Ma collection (${save.mons.length}/${MONSTERS.length})</button>
 <div class="soon">Bientôt : Survie · Contre la montre · Question du jour · Mode en ligne</div>`;
}
function levels(){
 let h=`<div class="top"><button class="btn small gray" onclick="home()">${ic("back")} Retour</button></div><h2>Choisis un niveau</h2><div class="grid">`;
 LEVELS.forEach((l,i)=>{
  const lock=i>=save.unlocked,s=save.stars[i]||0;
  h+=lock?`<div class="lvl locked">${ic("lock")}</div>`:`<button class="lvl lc${i%5}" onclick="start(${i})">${i+1}<span class="st">${starsRow(s)}</span></button>`;
 });
 $.innerHTML=h+`</div><div class="sub" style="margin-top:18px">Tu as 3 cœurs par niveau. Chaque niveau réussi te donne un nouveau monstre !</div>`;
}
function start(i){G={l:i,i:0,lives:3,score:0};question();}
function question(){
 const L=LEVELS[G.l],Q=L.q[G.i],cc=CAT[Q.c]||COL.blue;
 let h=`<div class="top"><button class="btn small gray" onclick="levels()" aria-label="Quitter">${ic("close")}</button><span class="hearts">${[0,1,2].map(k=>ic("heart",k<G.lives)).join("")}</span></div>
 <div class="bar"><i style="width:${G.i/L.q.length*100}%"></i></div>
 <div class="card" style="--cat:${cc}"><span class="cat">${Q.c}</span><div class="q">${Q.q}</div>${Q.img?`<div class="img">${ic(Q.img)}</div>`:""}`;
 Q.a.forEach((a,k)=>{h+=Q.t==="tf"?`<button class="ans tf tf${k}" onclick="answer(${k})">${a}</button>`:`<button class="ans" onclick="answer(${k})"><span class="bd b${k}">${"ABCD"[k]}</span>${a}</button>`});
 $.innerHTML=h+`<div class="fb" id="fb"></div></div>`;
}
function answer(k){
 const Q=LEVELS[G.l].q[G.i],btns=[...document.querySelectorAll(".ans")],good=k===Q.ok;
 btns.forEach((b,j)=>{b.disabled=true;if(j===Q.ok)b.classList.add("good");else if(j===k)b.classList.add("bad")});
 if(good)G.score++;else G.lives--;
 const fb=document.getElementById("fb");
 fb.className="fb "+(good?"ok":"ko");
 fb.innerHTML=good?`${ic("star",true)} Bravo !`:"Oups, la bonne réponse est en vert.";
 setTimeout(()=>{
  if(G.lives<=0)return end(false);
  G.i++;if(G.i>=LEVELS[G.l].q.length)return end(true);question();
 },1300);
}
function end(win){
 let h="";
 if(win){
  const stars=G.lives,prev=save.stars[G.l]||0;if(stars>prev)save.stars[G.l]=stars;
  save.unlocked=Math.max(save.unlocked,Math.min(G.l+2,LEVELS.length));
  let newMon=-1;const m=G.l+1;if(m<MONSTERS.length&&!save.mons.includes(m)){save.mons.push(m);newMon=m}
  persist();
  h=`<h2>Niveau réussi !</h2><div class="card" style="text-align:center;--cat:${COL.green}"><div class="stars pop">${starsRow(stars)}</div><p>${G.score} bonne(s) réponse(s) sur ${LEVELS[G.l].q.length}</p>
  ${newMon>=0?`<p><b>Nouveau monstre : ${MONSTERS[newMon].n} !</b></p><div class="big pop">${monster(newMon)}</div>`:`<div class="big pop">${monster(G.l)}</div>`}</div>
  ${G.l+1<LEVELS.length?`<button class="btn green" onclick="start(${G.l+1})">Niveau suivant</button>`:`<p class="sub"><b>Tu as terminé tous les niveaux !</b> D'autres arrivent bientôt.</p>`}
  <button class="btn blue" onclick="levels()">Choisir un niveau</button>`;
 }else{
  h=`<h2>Oh non…</h2><div class="card" style="text-align:center;--cat:${COL.red}"><div class="big">${monster(G.l,"sad")}</div><p>Plus de cœurs ! Courage, tu peux réessayer.</p></div>
  <button class="btn orange" onclick="start(${G.l})">Réessayer</button><button class="btn blue" onclick="levels()">Choisir un niveau</button>`;
 }
 $.innerHTML=h;
}
function collection(){
 let h=`<div class="top"><button class="btn small gray" onclick="home()">${ic("back")} Retour</button></div><h2>Ma collection</h2><div class="grid">`;
 MONSTERS.forEach((m,i)=>{const has=save.mons.includes(i);h+=`<div class="card mon ${has?"":"off"}" style="--mc:${m.c}">${monster(i)}<b>${has?m.n:"???"}</b></div>`});
 $.innerHTML=h+`</div><div class="sub" style="margin-top:16px">Réussis les niveaux pour débloquer de nouveaux monstres.</div>`;
}
home();
</script>
</body>
</html>
